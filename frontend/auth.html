<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>

<body>

    <div class="mainContainer">

        <div class="loginContainer " id="login-container">
            <h1>
                Login
            </h1>
            <div class="login-inputBox">
                <label for="">Username or email</label>
                <input type="text" placeholder="Enter username or email">
            </div>
            <div class="login-inputBox">
                <label for="">Password</label>
                <input type="text" placeholder="Enter your password">
            </div>

            <div class="forgetPassword">
                Forgot password?
            </div>

            <button>
                Sign In
            </button>


            <div class="sepration">
                <div class="line"></div> or
                <div class="line"></div>
            </div>

            <div class="google">
                <i class="fa-brands fa-google"></i>
                Sign in with Google
            </div>

            <div class="anotherPagelink">
                Are you new? <span id="gotoregisterPage">Create an Account?</span>
            </div>
        </div>


        <div class="registerContainer hideContainer" id="register-container">
            <h1>
                Register
            </h1>
            <div class="registerinputBox">
                <label for="">Username</label>
                <input type="text" placeholder="Enter Your username">
            </div>
            <div class="registerinputBox">
                <label for="">Email</label>
                <input type="text" placeholder="Enter Your email">
            </div>
            <div class="registerinputBox">
                <label for="">Phonenumber</label>
                <input type="text" placeholder="98*********">
            </div>
            <div class="registerinputBox">
                <label for="">Password</label>
                <input type="text" placeholder="*********">
            </div>
            <div class="registerinputBox">
                <label for="">Confirm Password</label>
                <input type="text" placeholder="*********">
            </div>

            <button class="signup">
                Sign Up
            </button>

            <div class="sepration">
                <div class="line"></div> or
                <div class="line"></div>
            </div>

            <div class="google">
                <i class="fa-brands fa-google"></i>
                Sign in with Google
            </div>

            <div class="anotherPagelink">
                Already Have Account? <span id="gotologin">Login</span>
            </div>
        </div>

        <a class="backHome" href="/index.html">
            Back to Home
        </a>

    </div>

    <script src="/scripts/auth.js"></script>

</body>

</html>
