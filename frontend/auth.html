<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="mainContainer">

        <div class="loginContainer">
            <h1>
                Login
            </h1>
            <div class="inputBox">
                <label for="">Username or email</label>
                <input type="text">
            </div>
            <div class="inputBox">
                <label for="">Password</label>
                <input type="text">
            </div>

            <div class="forgetPassword">
                Forgot password?
            </div>

            <button>
                Sign up
            </button>


            <div class="sepration">
                ------ or -------
            </div>

            <div class="google">
                Sign in with Google
            </div>

            <div>
                Are you new? <span>Create an Account?</span>
            </div>
        </div>

        
        <div class="registerContainer ">
            <h1>
                Register
            </h1>
            <div class="inputBox">
                <label for="">Username or email</label>
                <input type="text">
            </div>
            <div class="inputBox">
                <label for="">Password</label>
                <input type="text">
            </div>

            <div class="forgetPassword">
                Forgot password?
            </div>

            <button>
                Sign up
            </button>


            <div class="sepration">
                ------ or -------
            </div>

            <div class="google">
                Sign in with Google
            </div>

            <div>
                Already Have Account? <span>Create an Account?</span>
            </div>
        </div>

    </div>

</body>

</html>
