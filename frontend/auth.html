<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>

<body>
    <div class="mainContainer">
        <div class="loginContainer hideContainer" id="login-container">
            <h1>
                Login
            </h1>
            <div class="login-inputBox">
                <label for="">Username or email</label>
                <input type="text" placeholder="Enter username or email" name="username">
            </div>
            <div class="login-inputBox">
                <label for="">Password</label>
                <input type="password" placeholder="Enter your password" name="password">
            </div>

            <div class="forgetPassword">
                Forgot password?
            </div>

            <button id="loginButton">
                Sign In
            </button>


            <div class="sepration">
                <div class="line"></div> or
                <div class="line"></div>
            </div>

            <div class="google">
                <i class="fa-brands fa-google"></i>
                Sign in with Google
            </div>

            <div class="anotherPagelink">
                Are you new? <span id="gotoregisterPage">Create an Account?</span>
            </div>
        </div>
        <div class="registerContainer hideContainer" id="register-container">
            <h1>
                Register
            </h1>
            <div class="registerinputBox">
                <label for="Username">Username</label>
                <input type="text" placeholder="Enter Your username" name="username">
            </div>
            <div class="registerinputBox">
                <label for="Email">Email</label>
                <input type="text" placeholder="Enter Your email" name="email">
            </div>
            <div class="registerinputBox">
                <label for="Phonenumber">Phonenumber</label>
                <input type="text" placeholder="98*********" name="phoneNumber">
            </div>
            <div class="registerinputBox">
                <label for="Password">Password</label>
                <input type="password" placeholder="*********" name="password">
            </div>
            <div class="registerinputBox">
                <label for="ConfirmPassword">Confirm Password</label>
                <input type="password" placeholder="*********" name="confirmPassword">
            </div>

            <div class="errorMessage" id="registerError">
            </div>

            <button class="signup" id="registerButton">
                Sign Up
            </button>

            <div class="sepration">
                <div class="line"></div> or
                <div class="line"></div>
            </div>

            <div class="google">
                <i class="fa-brands fa-google"></i>
                Sign in with Google
            </div>

            <div class="anotherPagelink">
                Already Have Account? <span id="gotologin">Login</span>
            </div>
        </div>
        <a class="backHome" href="/index.html">
            Back to Home
        </a>
    </div>
    <script type="module" src="/scripts/auth.js"></script>

</body>

</html>
