<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
    <div class="backgroundNavColor" id="navBarContainer"></div>

    <div class="container cartContainer">
        <div class="leftSide">
            <div class="headCart">
                <span> Shopping cart </span>
            </div>
            <div class="cardItems">
 
            </div>
        </div>
        <div class="rightSide">
            <span> Order Summary </span>
            <div class="line"></div>
            <div class="orderSummary">
                <div class="summaryItems">
                    <p class="start">Sub product:</p>
                    <p>3000</p>
                </div>
                <div class="summaryItems">
                    <p class="start">Shipping Cost :</p>
                    <p>0</p>
                </div>
            </div>
            <div class="line"></div>

            <div class="total">
                <p class="start">Total :</p>

                <p>3000</p>
            </div>

            <button class="checkoutBtn">Checkout</button>
        </div>
    </div>

    <script type="module" src="scripts/navbar.js"></script>
    <script type="module" src="scripts/cart.js"></script>
</body>

</html>
