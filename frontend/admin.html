<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdminPannel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>

<body>
    <div class="adminmainContainer">
        <!-- /// left side bar  -->
        <div class="leftSide" id="leftSide">
            <h1>Admin Panel</h1>
            <div class="sideItems">
                <div class="item" data-page="dashboard">
                    <i class="fa-solid fa-house"></i>
                    <div>Dashboard</div>
                </div>
                <div class="item" data-page="category">
                    <i class="fa-solid fa-layer-group"></i>
                    <div>Category</div>
                </div>
                <div class="item" data-page="product">
                    <i class="fa-solid fa-socks"></i>
                    <div>Product</div>
                </div>
                <div class="item" data-page="user">
                    <i class="fa-solid fa-users"></i>
                    <div>User</div>
                </div>
                <div class="item" data-page="order">
                    <i class="fa-solid fa-list"></i>
                    <div>Order</div>
                </div>
            </div>

            <div id="closebutton">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
        <div class="slider" id="sliderButton">
            <i class="fa-solid fa-bars"></i>
        </div>

        <!-- /// right side main section  -->
        <div class="rightSide" id="mainConatiner"></div>


        <!-- category modal   -->

        <div class="modal" id="addCategoryModal">
            <div class="modalContent">

                <div class="closeButton" id="closeCategoryModal">
                    <i class="fa-solid fa-xmark"></i>
                </div>

                <h1>Add Category</h1>

                <div class="insideSection">

                    <div class="formGroup">
                        <label for="categoryName">Category Name</label>
                        <input type="text" id="categoryName" name="categoryName" placeholder="Enter category name">
                    </div>
                    <span class="errormessage" id="categoryError"></span>

                    <button type="submit" id="submitCategory">
                        Add Category
                    </button>

                </div>
            </div>
        </div>

        <!-- product open modal  -->
        <div class="modal" id="AddProductModal">
            <div class="modalContent">
                <div class="closeButton" id="closeProductModal">
                    <i class="fa-solid fa-xmark"></i>
                </div>
                <h1>Add Product</h1>
                <div class="insideSection">
                    <div class="productInputbox">
                        <label for="name">Name</label>
                        <input type="text" id="productName" class="productInput"
                            placeholder="Enter Your Product Name" />
                    </div>
                    <div class="productInputbox">
                        <label for="price">Price</label>
                        <input type="number" id="price" class="productInput" placeholder="Enter Your Product Price" />
                    </div>
                    <div class="productInputbox">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" class="productInput" placeholder="Enter Your Product Stock" />
                    </div>
                    <div class="productInputbox">
                        <label for="Catagory">Category</label>
                        <select name="Catagory" id="Catagory">
                            <option value="" disabled selected>Choose Category</option>
                        </select>
                    </div>
                    <div class="productInputbox">
                        <label for="size">Size</label>
                        <div class="radiosection">
                            <div class="radioItem">
                                <input type="checkbox" name="size" id="S" />
                                <label for="S">S</label>
                            </div>
                            <div class="radioItem">
                                <input type="checkbox" name="size" id="M" />
                                <label for="M">M</label>
                            </div>
                            <div class="radioItem">
                                <input type="checkbox" id="L" />
                                <label for="L">L</label>
                            </div>
                            <div class="radioItem">
                                <input type="checkbox" name="size" id="XL" />
                                <label for="XL">XL</label>
                            </div>
                            <div class="radioItem">
                                <input type="checkbox" name="size" id="XXL" />
                                <label for="XXL">XXL</label>
                            </div>
                            <div class="radioItem">
                                <input type="checkbox" name="size" id="XXL" />
                                <label for="XXL">XXXL</label>
                            </div>
                        </div>
                    </div>
                    <div class="productInputbox">
                        <label for="stock">Description</label>
                        <textarea name="description" id="productDescription"></textarea>
                    </div>
                    <div class="productInputbox">
                        <label for="stock">Image</label>
                        <input type="file" id="image" />
                    </div>

                    <span class="errormessage" id="errorMessage"></span>

                    <button class="addButton" id="submitProductButton">
                        Add Product
                    </button>
                </div>
            </div>
        </div>

        <!-- // Add User Modal -->
        <div class="modal" id="addUserModal">
            <div class="modalContent">
                <div class="closeButton" id="modalCloseButton">
                    <i class="fa-solid fa-xmark"></i>
                </div>
                <h1>Add User</h1>
                <div class="insideSection">
                    <div class="userInputbox">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter Username" />
                    </div>
                    <div class="userInputbox">
                        <label for="email">Email</label>
                        <input type="text" id="email" placeholder="Enter Email" />
                    </div>
                    <div class="userInputbox">
                        <label for="phoneNumber">Phonenumber</label>
                        <input type="text" id="phoneNumber" placeholder="Enter Phonenumber" />
                    </div>
                    <div class="userInputbox">
                        <label for="password">Password</label>
                        <input type="text" id="password" placeholder="Enter Phonenumber" />
                    </div>
                    <span class="errormessage" id="userErrorMessage"></span>

                    <button class="addButton" id="submitUserButton">Add User</button>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/admin.js"></script>
</body>

</html>
