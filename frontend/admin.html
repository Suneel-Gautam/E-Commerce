<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminPannel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="adminmainContainer">
        <!-- /// left side bar  -->
        <div class="leftSide" id="leftSide">
            <h1>Admin Panel</h1>
            <div class="sideItems" >
                <div class="item" data-page="dashboard">
                    <i class="fa-solid fa-house"></i>
                    <div>Dashboard</div>
                </div>
                <div class="item" data-page="product">
                    <i class="fa-solid fa-socks"></i>
                    <div>Product</div>
                </div>
                <div class="item" data-page="user">
                    <i class="fa-solid fa-users"></i>
                    <div>User</div>
                </div>
                <div class="item" data-page="order">
                    <i class="fa-solid fa-list"></i>
                    <div>Order</div>
                </div>
            </div>

            <div id="closebutton">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
        <div class="slider" id="sliderButton">
            <i class="fa-solid fa-bars"></i>
        </div>



        <!-- /// right side main section  -->
        <div class="rightSide" id="mainConatiner">

            <!-- // dshboard informations  -->



            <!-- product open modal  -->
            <div class="modal" id="AddProductModal">
                <div class="modalContent">
                    <div class="closeButton" id="closeProductModal">
                        <i class="fa-solid fa-xmark"></i>
                    </div>
                    <h1>
                        Add Product
                    </h1>
                    <div class="insideSection">
                        <div class="productInputbox">
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Enter Your Product Name">
                        </div>
                        <div class="productInputbox">
                            <label for="price">Price</label>
                            <input type="number" id="name" placeholder="Enter Your Product Price">
                        </div>
                        <div class="productInputbox">
                            <label for="stock">Stock</label>
                            <input type="number" id="name" placeholder="Enter Your Product Stock">
                        </div>
                        <div class="productInputbox">
                            <label for="Catagory">Catagory</label>
                            <select name="" id="">
                                <option value="" disabled selected>Choose Catagory</option>
                                <option value="">Shoes</option>
                            </select>
                        </div>
                        <div class="productInputbox">
                            <label for="size">Size</label>
                            <div class="radiosection">
                                <div class="radioItem">
                                    <input type="radio">
                                    <label for="">S</label>
                                </div>
                                <div class="radioItem">
                                    <input type="radio">
                                    <label for="">M</label>
                                </div>
                                <div class="radioItem">
                                    <input type="radio">
                                    <label for="">L</label>
                                </div>
                                <div class="radioItem">
                                    <input type="radio">
                                    <label for="">xL</label>
                                </div>
                                <div class="radioItem">
                                    <input type="radio">
                                    <label for="">XXL</label>
                                </div>
                                <div class="radioItem">
                                    <input type="radio">
                                    <label for="">XXXL</label>
                                </div>
                            </div>

                        </div>
                        <div class="productInputbox">
                            <label for="stock">Description</label>
                            <textarea name="" id="">
                            </textarea>
                        </div>
                        <div class="productInputbox">
                            <label for="stock">Image</label>
                            <input type="file">
                        </div>

                        <button class="addButton">
                            Add Product
                        </button>
                    </div>
                </div>
            </div>
            <!-- /// user data section-->
            <section class="userContainer">
                <button class="btn" id="addUserButton">Add User</button>
                <table>
                    <tr>

                    </tr>

                    <tr>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
            </section>

            <!-- // Add User Modal -->
            <div class="modal" id="addUserModal">
                <div class="modalContent">
                    <div class="closeButton" id="modalCloseButton">
                        <i class="fa-solid fa-xmark"></i>
                    </div>
                    <h1>
                        Add User
                    </h1>
                    <div class="insideSection">
                        <div class="userInputbox">
                            <label for="name">Username</label>
                            <input type="text" id="name" placeholder="Enter Username">
                        </div>
                        <div class="userInputbox">
                            <label for="name">Email</label>
                            <input type="text" id="name" placeholder="Enter Email">
                        </div>
                        <div class="userInputbox">
                            <label for="name">Phonenumber</label>
                            <input type="text" id="name" placeholder="Enter Phonenumber">
                        </div>
                        <div class="userInputbox">
                            <label for="name">Password</label>
                            <input type="text" id="name" placeholder="Enter Phonenumber">
                        </div>

                        <button class="addButton">
                            Add User
                        </button>
                    </div>
                </div>
            </div>



        </div>

    </div>

    <script src="scripts/admin.js"></script>

</body>

</html>
