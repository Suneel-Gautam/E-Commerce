<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Now</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/productDetails.css">
</head>


</button>

<body>
    <div class="backgroundNavColor" id="navBarContainer"></div>
    <div class="container shopPage">
        <div class="leftSide">
            <div class="top-header">
                <i class="fa-solid fa-filter"></i>
                <span>Filter</span>
            </div>
            <div class="category">
                <h1> Category </h1>
                <div class="search">
                    <input type="text" placeholder="Search Category" class="searchCategory">
                </div>
                <div class="catogeryFilter">
                </div>
            </div>
            <div class="price">
                <h1>Price</h1>
                <div class="priceRange">
                    <input type="text" placeholder="min" id="min">
                    _
                    <input type="text" placeholder="max" id="max">
                </div>
            </div>
            <div class="size">
                <h1>Size</h1>
                <div class="sizeItems">
                </div>
            </div>
        </div>

        <!-- //leftSide small tab filter -->
        <div class="leftSideMobile">
            <div class="closeBtn">
                <i class="fa-solid fa-xmark" style="font-size: 30px;"></i>
            </div>
            <div class="top-header">
                <i class="fa-solid fa-filter"></i>
                <span>Filter</span>
            </div>
            <div class="category">
                <h1> Category </h1>
                <div class="search">
                    <input type="text" placeholder="Search Category" class="searchCategory">
                </div>
                <div class="catogeryFilter" id="category-Filter">
                </div>
            </div>
            <div class="price">
                <h1>Price</h1>
                <div class="priceRange">

                </div>
            </div>
            <div class="size">
                <h1>Size</h1>
                <div class="sizeItems" id="size-Items">
                </div>
            </div>
        </div>

        <div class="rightSide">
            <div class="filterOpen">
                <span>
                    Filter Product
                </span>
            </div>
            <div class="cards">

            </div>

            <div class="notFoundMessage">
                <span>Product not Found!!!!</span>
            </div>


        </div>
    </div>



    <script type="module" src="scripts/navbar.js"></script>
    <script type="module" src="scripts/shop.js"></script>
    <script type="module" src="components/productModal.js"></script>
</body>

</html>
